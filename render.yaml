services:
    - type: web
    name: local-llm-server
    env: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    healthCheckPath: /api/health
    envVars:
            - key: MONGO_URL
        sync: false
            - key: DB_NAME
        value: llm_wiki_dashboard
            - key: STORAGE_BACKEND
        value: "mongo"
            - key: JWT_SECRET
        generateValue: true
            - key: ADMIN_EMAIL
        value: admin@llmrelay.local
            - key: ADMIN_PASSWORD
        sync: false
            - key: ACTIVATION_REQUIRED
        value: "false"
            - key: RUN_TELEGRAM_BOT
        value: "true"
            - key: BOT_KEEPALIVE
        value: "true"
            - key: FREEBUFF_EMBEDDED
        value: "true"
            - key: TELEGRAM_BOT_TOKEN
        sync: false
            - key: TELEGRAM_CHAT_ID
        sync: false
            - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
            - key: TELEGRAM_ADMIN_USER_IDS
        sync: false
            - key: GITHUB_TOKEN
        sync: false
            - key: NVIDIA_API_KEY
        sync: false
            - key: SCANNER_HEADLESS_RENDER
        value: "off"
